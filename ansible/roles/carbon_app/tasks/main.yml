---
- name: Install Python and venv
  ansible.builtin.apt:
    name: [python3, python3-venv, python3-pip]
    state: present
    update_cache: true

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy application files
  ansible.builtin.copy:
    src: "{{ project_src }}/{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
  loop:
    - main.py
    - requirements.txt
  notify: Restart carbon-tracker

- name: Install requirements in a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Install systemd service file
  ansible.builtin.template:
    src: carbon-tracker.service.j2
    dest: /etc/systemd/system/carbon-tracker.service
  notify: Restart carbon-tracker

- name: Enable and start the service
  ansible.builtin.systemd:
    name: carbon-tracker
    enabled: true
    state: started
    daemon_reload: true